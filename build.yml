name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#100f18' --iconBackgroundColorDark '#100f18' --splashBackgroundColor '#100f18' --splashBackgroundColorDark '#100f18'
        continue-on-error: true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: flowr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
